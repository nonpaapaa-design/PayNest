<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <title>เข้าสู่ระบบ | PayNest Premium</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="assets/css/variables.css">

    <link rel="stylesheet"
          href="assets/css/style.css">

    <link rel="stylesheet"
          href="assets/css/components.css">

    <link rel="stylesheet"
          href="assets/css/responsive.css">

</head>

<body>

    <div id="loader"></div>

    <main class="auth-page">

        <div class="auth-card fade-up">

            <div class="auth-header">

                <h1>PayNest Premium</h1>

                <p>เข้าสู่ระบบเพื่อใช้งานบัญชีของคุณ</p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label class="form-label">

                        อีเมล

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="example@email.com"
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">

                        รหัสผ่าน

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="••••••••"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>
