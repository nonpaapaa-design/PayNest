<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayNest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="background"></div>

<div class="app">

<header class="topbar">

<div>

<h1>PayNest</h1>

<p>จัดการการผ่อนของคุณ</p>

</div>

<div class="top-actions">

<button class="icon-btn">

<span class="material-symbols-rounded">
search
</span>

</button>

<button class="icon-btn">

<span class="material-symbols-rounded">
notifications
</span>

</button>

</div>

</header>

<section class="hero">

<p>ยอดคงเหลือทั้งหมด</p>

<h2>฿24,350</h2>

<div class="progress">

<div class="progress-bar"></div>

</div>

<div class="hero-footer">

<span>6 สัญญา</span>

<span>ชำระแล้ว 64%</span>

</div>

</section>

<section class="cards">

<div class="card">

<span class="material-symbols-rounded">
payments
</span>

<h3>฿6,990</h3>

<p>ยอดเดือนนี้</p>

</div>

<div class="card">

<span class="material-symbols-rounded">
event
</span>

<h3>15 พ.ค.</h3>

<p>งวดถัดไป</p>

</div>

</section>

<section class="list">

<h2>รายการล่าสุด</h2>

</section>

<button class="fab">

<span class="material-symbols-rounded">

add

</span>

</button>

<nav class="bottom-nav">

<button class="active">

<span class="material-symbols-rounded">

home

</span>

</button>

<button>

<span class="material-symbols-rounded">

credit_card

</span>

</button>

<button>

<span class="material-symbols-rounded">

calendar_month

</span>

</button>

<button>

<span class="material-symbols-rounded">

bar_chart

</span>

</button>

<button>

<span class="material-symbols-rounded">

settings

</span>

</button>

</nav>

</div>

<script src="js/app.js"></script>

</body>
</html>
