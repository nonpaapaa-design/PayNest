<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#2563eb">

    <title>สมัครสมาชิก | PayNest Premium</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="assets/css/variables.css">

    <link rel="stylesheet"
          href="assets/css/style.css">

    <link rel="stylesheet"
          href="assets/css/components.css">

    <link rel="stylesheet"
          href="assets/css/responsive.css">

</head>

<body>

    <div id="loader"></div>

    <main class="auth-page">

        <div class="auth-card fade-up">

            <div class="auth-header">

                <h1>สร้างบัญชี PayNest</h1>

                <p>เริ่มต้นใช้งาน PayNest Premium</p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label class="form-label">

                        ชื่อ-นามสกุล

                    </label>

                    <input
                        type="text"
                        id="fullname"
                        class="form-input"
                        placeholder="ชื่อ นามสกุล"
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">

                        อีเมล

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="example@email.com"
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">

                        รหัสผ่าน

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="อย่างน้อย 6 ตัวอักษร"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>
                <div class="form-group">

                    <label class="form-label">

                        ยืนยันรหัสผ่าน

                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="ยืนยันรหัสผ่าน"
                            required>

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">

                        <input
                            type="checkbox"
                            id="acceptTerms"
                            required>

                        <span>

                            ฉันยอมรับ
                            <a href="#">ข้อกำหนดการใช้งาน</a>
                            และ
                            <a href="#">นโยบายความเป็นส่วนตัว</a>

                        </span>

                    </label>

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    style="width:100%;">

                    <i class="fa-solid fa-user-plus"></i>

                    สมัครสมาชิก

                </button>

                <div
                    style="
                        margin-top:24px;
                        text-align:center;
                    ">

                    มีบัญชีอยู่แล้ว?

                    <a href="login.html">

                        เข้าสู่ระบบ

                    </a>

                </div>

            </form>

        </div>

    </main>

    <script src="assets/js/app.js"></script>

    <script src="assets/js/auth.js"></script>

</body>

</html>
